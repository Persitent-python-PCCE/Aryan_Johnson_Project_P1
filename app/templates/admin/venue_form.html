{% extends "base.html" %}

{% block title %}
    Create Venue
{% endblock %}

{% block content %}

<div class="form-page">

    <div class="page-header">

        <span class="eyebrow">
            MANAGEMENT
        </span>

        <h1>
            Create Venue
        </h1>

        <p class="page-subtitle">
            Add a location where events can be hosted.
        </p>

    </div>


    <div class="form-card">

        <form
            method="POST"
            action="{{ url_for('admin.create_venue') }}"
        >

            <div class="form-section">

                <div class="form-section-title">
                    Venue Information
                </div>


                <div class="form-grid">

                    <div class="form-group">

                        <label for="name">
                            Venue Name
                        </label>

                        <input
                            type="text"
                            id="name"
                            name="name"
                            required
                            placeholder="e.g. City Arena"
                        >

                    </div>


                    <div class="form-group">

                        <label for="city">
                            City
                        </label>

                        <input
                            type="text"
                            id="city"
                            name="city"
                            required
                            placeholder="e.g. Bangalore"
                        >

                    </div>

                </div>


                <div class="form-group">

                    <label for="address">
                        Address
                    </label>

                    <input
                        type="text"
                        id="address"
                        name="address"
                        required
                        placeholder="Complete venue address"
                    >

                </div>


                <div class="form-grid">

                    <div class="form-group">

                        <label for="capacity">
                            Capacity
                        </label>

                        <input
                            type="number"
                            id="capacity"
                            name="capacity"
                            min="1"
                            required
                            placeholder="e.g. 5000"
                        >

                        <small class="form-help">
                            Maximum number of attendees.
                        </small>

                    </div>


                    <div class="form-group">

                        <label for="description">
                            Description
                        </label>

                        <input
                            type="text"
                            id="description"
                            name="description"
                            placeholder="Optional description"
                        >

                    </div>

                </div>

            </div>


            <div class="form-actions">

                <a
                    href="{{ url_for('admin.venues') }}"
                    class="btn btn-secondary"
                >
                    Cancel
                </a>

                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    Create Venue
                </button>

            </div>

        </form>

    </div>

</div>

{% endblock %}
