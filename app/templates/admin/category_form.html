{% extends "base.html" %}

{% block title %}
    Create Category
{% endblock %}

{% block content %}

<div class="form-page">

    <div class="page-header">

        <span class="eyebrow">
            MANAGEMENT
        </span>

        <h1>
            Create Category
        </h1>

        <p class="page-subtitle">
            Add a category that can be assigned to events.
        </p>

    </div>


    <div class="form-card">

        <form
            method="POST"
            action="{{ url_for('admin.create_category') }}"
        >

            <div class="form-section">

                <div class="form-section-title">
                    Category Information
                </div>

                <div class="form-group">

                    <label for="name">
                        Category Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        required
                        placeholder="e.g. Concerts"
                    >

                </div>


                <div class="form-group">

                    <label for="description">
                        Description
                    </label>

                    <textarea
                        id="description"
                        name="description"
                        rows="5"
                        placeholder="Describe this category..."
                    ></textarea>

                </div>

            </div>


            <div class="form-actions">

                <a
                    href="{{ url_for('admin.categories') }}"
                    class="btn btn-secondary"
                >
                    Cancel
                </a>

                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    Create Category
                </button>

            </div>

        </form>

    </div>

</div>

{% endblock %}
