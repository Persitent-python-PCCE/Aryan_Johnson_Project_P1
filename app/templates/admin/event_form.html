{% extends "base.html" %}

{% block title %}
    Create Event
{% endblock %}

{% block content %}

<div class="form-page">

    <div class="page-header">

        <span class="eyebrow">
            EVENT MANAGEMENT
        </span>

        <h1>
            Create Event
        </h1>

        <p class="page-subtitle">
            Create an event and configure when and where it will take place.
        </p>

    </div>


    <div class="form-card">

        <form
            method="POST"
            action="{{ url_for('admin.create_event') }}"
        >

            <div class="form-section">

                <div class="form-section-title">
                    Basic Information
                </div>


                <div class="form-group">

                    <label for="name">
                        Event Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        required
                        placeholder="e.g. Live Music Festival"
                    >

                </div>


                <div class="form-group">

                    <label for="description">
                        Description
                    </label>

                    <textarea
                        id="description"
                        name="description"
                        rows="5"
                        placeholder="Describe the event..."
                    ></textarea>

                </div>


                <div class="form-grid">

                    <div class="form-group">

                        <label for="category_id">
                            Category
                        </label>

                        <select
                            id="category_id"
                            name="category_id"
                            required
                        >

                            <option value="">
                                Select category
                            </option>

                            {% for category in categories %}

                                <option
                                    value="{{ category.id }}"
                                >
                                    {{ category.name }}
                                </option>

                            {% endfor %}

                        </select>

                    </div>


                    <div class="form-group">

                        <label for="venue_id">
                            Venue
                        </label>

                        <select
                            id="venue_id"
                            name="venue_id"
                            required
                        >

                            <option value="">
                                Select venue
                            </option>

                            {% for venue in venues %}

                                <option
                                    value="{{ venue.id }}"
                                >
                                    {{ venue.name }} — {{ venue.city }}
                                </option>

                            {% endfor %}

                        </select>

                    </div>

                </div>

            </div>


            <div class="form-section">

                <div class="form-section-title">
                    Schedule
                </div>


                <div class="form-grid">

                    <div class="form-group">

                        <label for="event_date">
                            Event Date
                        </label>

                        <input
                            type="date"
                            id="event_date"
                            name="event_date"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="status">
                            Status
                        </label>

                        <select
                            id="status"
                            name="status"
                        >

                            <option value="DRAFT">
                                Draft
                            </option>

                            <option value="PUBLISHED">
                                Published
                            </option>

                            <option value="CANCELLED">
                                Cancelled
                            </option>

                            <option value="COMPLETED">
                                Completed
                            </option>

                        </select>

                    </div>

                </div>


                <div class="form-grid">

                    <div class="form-group">

                        <label for="start_time">
                            Start Time
                        </label>

                        <input
                            type="time"
                            id="start_time"
                            name="start_time"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="end_time">
                            End Time
                        </label>

                        <input
                            type="time"
                            id="end_time"
                            name="end_time"
                            required
                        >

                    </div>

                </div>

            </div>


            <div class="form-actions">

                <a
                    href="{{ url_for('admin.events') }}"
                    class="btn btn-secondary"
                >
                    Cancel
                </a>

                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    Create Event
                </button>

            </div>

        </form>

    </div>

</div>

{% endblock %}
