<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Category</title>
</head>

<body>

    <h1>Create Category</h1>

    <p>
        <a href="{{ url_for('admin.categories') }}">
            ← Back to Categories
        </a>
    </p>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <p>
                    <strong>{{ category }}:</strong>
                    {{ message }}
                </p>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form
        method="POST"
        action="{{ url_for('admin.create_category') }}"
    >

        <div>
            <label for="name">
                Name
            </label>

            <input
                type="text"
                id="name"
                name="name"
                required
                maxlength="100"
            >
        </div>

        <br>

        <div>
            <label for="description">
                Description
            </label>

            <textarea
                id="description"
                name="description"
                rows="4"
            ></textarea>
        </div>

        <br>

        <button type="submit">
            Create Category
        </button>

    </form>

</body>
</html>
