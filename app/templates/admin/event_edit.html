{% extends "base.html" %}

{% block title %}
    Edit Event
{% endblock %}

{% block content %}

<div class="form-page">

    <div class="page-header">

        <span class="eyebrow">
            EVENT MANAGEMENT
        </span>

        <h1>
            Edit Event
        </h1>

        <p class="page-subtitle">
            Update the details and schedule for this event.
        </p>

    </div>


    <div class="form-card">

        <form
            method="POST"
            action="{{ url_for(
                'admin.edit_event',
                event_id=event.id
            ) }}"
        >

            <div class="form-section">

                <div class="form-section-title">
                    Basic Information
                </div>


                <div class="form-group">

                    <label for="name">
                        Event Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        value="{{ event.name }}"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="description">
                        Description
                    </label>

                    <textarea
                        id="description"
                        name="description"
                        rows="5"
                    >{{ event.description or "" }}</textarea>

                </div>


                <div class="form-grid">

                    <div class="form-group">

                        <label for="category_id">
                            Category
                        </label>

                        <select
                            id="category_id"
                            name="category_id"
                            required
                        >

                            {% for category in categories %}

                                <option
                                    value="{{ category.id }}"
                                    {% if category.id == event.category_id %}
                                        selected
                                    {% endif %}
                                >
                                    {{ category.name }}
                                </option>

                            {% endfor %}

                        </select>

                    </div>


                    <div class="form-group">

                        <label for="venue_id">
                            Venue
                        </label>

                        <select
                            id="venue_id"
                            name="venue_id"
                            required
                        >

                            {% for venue in venues %}

                                <option
                                    value="{{ venue.id }}"
                                    {% if venue.id == event.venue_id %}
                                        selected
                                    {% endif %}
                                >
                                    {{ venue.name }} — {{ venue.city }}
                                </option>

                            {% endfor %}

                        </select>

                    </div>

                </div>

            </div>


            <div class="form-section">

                <div class="form-section-title">
                    Schedule
                </div>


                <div class="form-grid">

                    <div class="form-group">

                        <label for="event_date">
                            Event Date
                        </label>

                        <input
                            type="date"
                            id="event_date"
                            name="event_date"
                            value="{{ event.event_date }}"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="status">
                            Status
                        </label>

                        <select
                            id="status"
                            name="status"
                        >

                            {% for status in [
                                "DRAFT",
                                "PUBLISHED",
                                "CANCELLED",
                                "COMPLETED"
                            ] %}

                                <option
                                    value="{{ status }}"
                                    {% if event.status == status %}
                                        selected
                                    {% endif %}
                                >
                                    {{ status|title }}
                                </option>

                            {% endfor %}

                        </select>

                    </div>

                </div>


                <div class="form-grid">

                    <div class="form-group">

                        <label for="start_time">
                            Start Time
                        </label>

                        <input
                            type="time"
                            id="start_time"
                            name="start_time"
                            value="{{ event.start_time }}"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="end_time">
                            End Time
                        </label>

                        <input
                            type="time"
                            id="end_time"
                            name="end_time"
                            value="{{ event.end_time }}"
                            required
                        >

                    </div>

                </div>

            </div>


            <div class="form-actions">

                <a
                    href="{{ url_for('admin.events') }}"
                    class="btn btn-secondary"
                >
                    Cancel
                </a>

                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    Save Changes
                </button>

            </div>

        </form>

    </div>

</div>

{% endblock %}
